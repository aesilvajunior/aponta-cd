name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Depois de rodar `npm install` localmente e commitar o package-lock.json
      # atualizado, troque por `npm ci` (instalação exata e mais rápida).
      - run: npm ci --no-audit --no-fund

      - name: Lint (erros quebram, avisos não)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  # Testes de tela em navegador (celular e desktop). NÃO bloqueia o merge por enquanto:
  # foram escritos sem poder rodar num navegador no ambiente de desenvolvimento.
  # Quando passarem duas vezes seguidas, remova o `continue-on-error`.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
