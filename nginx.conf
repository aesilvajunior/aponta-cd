server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não expõe versão do Nginx nos cabeçalhos
    server_tokens off;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;

    # Cabeçalhos de segurança globais
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Healthcheck interno para Docker / orquestradores
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash do Vite: cache imutável de 1 ano
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Ícones do PWA
    location /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Manifest do PWA
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Service Worker e index.html: nunca cachear no navegador
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback (inclui /tv e demais rotas)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
